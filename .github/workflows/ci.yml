name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Clean data
        run: Rscript dataset_cleaning/datasetClean.R

      - name: Cleaned data unchanged
        run: git diff --exit-code -- dataset/Crop_recommendation_cleaned.csv

      - name: Provenance audit
        run: Rscript modelling/provenance_audit.R

      - name: Tests
        run: Rscript tests/testthat.R
